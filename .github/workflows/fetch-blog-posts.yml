name: Fetch Blog Posts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # 每天午夜运行

jobs:
  fetch-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Fetch blog posts
        run: |
          # 这里添加从您的博客内容仓库获取最新博客文章的脚本
          # 例如使用 GitHub API 获取最新的 Markdown 文件
          echo "Fetching blog posts..."

      - name: Trigger Cloudflare Pages Deployment
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/your-deploy-hook-url"
